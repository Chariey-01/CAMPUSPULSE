services:
  - type: web
    name: campuspulse-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn run:app"
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: campuspulse-db
    plan: free
